<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register - Online Job Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.jsp">JobPortal</a>
    <a class="btn btn-outline-light" href="login.html">Login</a>
  </div>
</nav>
<div class="container mt-5 mb-5" style="max-width:450px">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-3 text-center">Create Account</h2>
      <form>
        <input type="text" class="form-control mb-3" placeholder="Full name" required>
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <input type="tel" class="form-control mb-3" placeholder="Phone number">
        <select class="form-select mb-3">
          <option>Job Seeker</option>
          <option>Employer</option>
        </select>
        <input type="text" class="form-control mb-3" placeholder="Company name (employers only)">
        <button class="btn btn-primary w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
</div>
</body>
</html>
