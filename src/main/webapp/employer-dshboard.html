<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.jsp">JobPortal</a>
    <span class="text-white">Employer</span>
    <a class="btn btn-outline-light btn-sm" href="login.html">Logout</a>
  </div>
</nav>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
      <div class="list-group">
        <a href="#" class="list-group-item list-group-item-action active">Dashboard</a>
        <a href="#" class="list-group-item list-group-item-action">Post a Job</a>
        <a href="#" class="list-group-item list-group-item-action">My Jobs</a>
        <a href="#" class="list-group-item list-group-item-action">Applications</a>
        <a href="#" class="list-group-item list-group-item-action">Messages</a>
      </div>
    </div>
    <div class="col-md-9 col-lg-10 p-4">
      <h3 class="mb-4">Employer Dashboard</h3>
      <div class="row mb-4">
        <div class="col-sm-4 mb-2"><div class="card text-center"><div class="card-body"><h2>8</h2><p class="mb-0">Jobs Posted</p></div></div></div>
        <div class="col-sm-4 mb-2"><div class="card text-center"><div class="card-body"><h2>42</h2><p class="mb-0">Applications</p></div></div></div>
        <div class="col-sm-4 mb-2"><div class="card text-center"><div class="card-body"><h2>3</h2><p class="mb-0">Hired</p></div></div></div>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <h5>My Job Postings</h5>
        <button class="btn btn-primary btn-sm">+ Post New Job</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped bg-white">
          <thead class="table-primary">
            <tr><th>#</th><th>Job Title</th><th>Applicants</th><th>Posted On</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody>
            <tr><td>1</td><td>Java Developer</td><td>15</td><td>01 Oct 2026</td><td><span class="badge bg-success">Approved</span></td><td><button class="btn btn-sm btn-outline-primary">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
            <tr><td>2</td><td>UI Designer</td><td>9</td><td>29 Sep 2026</td><td><span class="badge bg-warning">Pending</span></td><td><button class="btn btn-sm btn-outline-primary">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
